<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
  <title>نظام اختتام الصيف | Summer Closing System | Système de Clôture</title>
  <meta name="description" content="نظام متكامل لإدارة اختتام مدرسة القرآن الصيفية: الطلاب، الاختبارات، الدرجات، وجدول يوم المهرجانية (الاختتام الصيفي)."/>

  <!-- ================== إعدادات PWA (التثبيت كتطبيق) ================== -->
  <link rel="manifest" href="manifest.json"/>
  <meta name="theme-color" content="#0b3d2e"/>
  <meta name="mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
  <meta name="apple-mobile-web-app-title" content="الاختتام الصيفي"/>
  <link rel="icon" type="image/svg+xml" href="icons/icon.svg"/>
  <link rel="apple-touch-icon" href="icons/icon-192.png"/>

  <!-- ================== الخطوط المميزة (غير عادية) ================== -->
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Reem+Kufi:wght@400;500;600;700&family=Tajawal:wght@300;400;500;700;800;900&family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet"/>

  <!-- ================== ملف التنسيقات ================== -->
  <link rel="stylesheet" href="css/style.css"/>
</head>

<body>

  <!-- ============ الخلفية الملونة المتحركة (أورورا) ============ -->
  <div class="bg-aurora" aria-hidden="true">
    <span class="blob b1"></span>
    <span class="blob b2"></span>
    <span class="blob b3"></span>
    <span class="blob b4"></span>
    <span class="stars"></span>
  </div>

  <div id="app">

    <!-- ======================================================
         شاشة الدخول (كلمة المرور / الكود)
         ====================================================== -->
    <section id="login-screen" class="screen login-wrap">
      <div class="login-card glass">

        <!-- شعار المدرسة -->
        <div class="logo-mark" aria-hidden="true">
          <svg viewBox="0 0 96 96" xmlns="http://www.w3.org/2000/svg">
            <!-- الهلال -->
            <path d="M48 3a6.5 6.5 0 1 0 4.5 11.2A7.5 7.5 0 1 1 48 3z" fill="#fff8e1"/>
            <!-- القبة -->
            <path d="M48 10c-9.5 8.5-14.5 16.8-14.5 25.2 0 4.2 1.6 7.4 4.3 9.8h20.4c2.7-2.4 4.3-5.6 4.3-9.8C62.5 26.8 57.5 18.5 48 10z" fill="#f6c453"/>
            <!-- المئذنتان -->
            <rect x="12" y="28" width="6.5" height="22" rx="3.2" fill="#7fe3c4"/>
            <rect x="77.5" y="28" width="6.5" height="22" rx="3.2" fill="#7fe3c4"/>
            <!-- القاعدة -->
            <rect x="18" y="47" width="60" height="6" rx="3" fill="#f6c453"/>
            <!-- الكتاب المفتوح (القرآن الكريم) -->
            <path d="M19 60c9.5-4.5 19-4.5 29 .8 10-5.3 19.5-5.3 29-.8v22.5c-9.5-4.5-19-4.5-29 .8-10-5.3-19.5-5.3-29-.8V60z" fill="#eafaf3"/>
            <path d="M48 60.8v22.5" stroke="#0b3d2e" stroke-width="2.6" stroke-linecap="round"/>
            <!-- خطوط النص -->
            <path d="M26 67c6-2 12-2 17 .5M26 73c6-2 12-2 17 .5M53 67.5c6-2.5 12-2.5 17-.5M53 73.5c6-2.5 12-2.5 17-.5" stroke="#2b8a6e" stroke-width="2" stroke-linecap="round" fill="none"/>
          </svg>
        </div>

        <h1 class="app-title" data-i18n="app_name"></h1>
        <p class="app-sub" data-i18n="app_subtitle"></p>

        <!-- نموذج الدخول بالكود -->
        <form id="login-form" autocomplete="off" novalidate>
          <label class="field-label" for="login-code" data-i18n="login_code"></label>
          <div class="input-wrap">
            <input id="login-code" type="password" inputmode="text"
                   data-i18n-placeholder="login_code_ph" required/>
            <button type="button" id="toggle-code" class="icon-btn" aria-label="show password">👁️</button>
          </div>

          <p id="login-error" class="error-msg hidden" data-i18n="login_error"></p>

          <button type="submit" class="btn btn-primary btn-lg btn-block" data-i18n="login_btn"></button>
        </form>

        <!-- مبدّل اللغات في شاشة الدخول -->
        <div class="login-foot">
          <div class="lang-switch" id="login-lang" role="group" aria-label="language"></div>
        </div>
      </div>
    </section>

    <!-- ======================================================
         التطبيق الرئيسي (يظهر بعد الدخول)
         - الرأس: زر (زيادة الحساب) + اللغات + التثبيت + الخروج
         - التبويبات الثلاثة: الكبار | الصغار | الاختتام الصيفي
           (مع دعم السحب بالإصبع للتنقل)
         ====================================================== -->
    <div id="main-screen" class="hidden">
      <header id="app-header"></header>
      <nav id="tabs" class="tabs-bar" aria-label="main navigation"></nav>
      <main id="view" class="view-container"></main>
      <footer id="app-footer"></footer>
    </div>

    <!-- ============ النافذة المنبثقة العامة (نماذج الإضافة/التعديل) ============ -->
    <div id="modal-root" class="modal-root hidden">
      <div id="modal-backdrop" class="modal-backdrop"></div>
      <div id="modal-box" class="modal glass" role="dialog" aria-modal="true"></div>
    </div>

    <!-- ============ الإشعارات (Toast) ============ -->
    <div id="toast-root" class="toast-root" aria-live="polite"></div>

    <noscript>
      <div style="padding:2rem;text-align:center;font-family:sans-serif;color:#fff;background:#b3261e">
        ⚠️ يرجى تفعيل JavaScript في المتصفح لتشغيل النظام | Please enable JavaScript | Veuillez activer JavaScript
      </div>
    </noscript>
  </div>

  <!-- ================== الملفات البرمجية (بالترتيب) ================== -->
  <script src="js/i18n.js" defer></script>
  <script src="js/db.js" defer></script>
  <script src="js/app.js" defer></script>
  <script src="js/ceremony.js" defer></script>
  <script src="js/admin.js" defer></script>
</body>
</html>
